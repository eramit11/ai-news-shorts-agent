name: Daily AI News Short

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 03:30 UTC = 09:00 IST; 12:30 UTC = 18:00 IST.
    - cron: "30 3 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

concurrency:
  group: daily-ai-news-short
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Automatically routes to a currently available free OpenRouter model.
      OPENROUTER_MODEL: openrouter/free
      YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
      YOUTUBE_CLIENT_SECRET_JSON_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_B64 }}
      YOUTUBE_CLIENT_SECRET_FILE: client_secret.json
      YOUTUBE_TOKEN_FILE: token.json
      # Keep this private until you have checked a few automated uploads.
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_CATEGORY_ID: "28"
      YOUTUBE_LANGUAGE: en
      TTS_VOICE: en-US-ChristopherNeural
      SHORT_SECONDS: "24"
      NEWS_LOOKBACK_HOURS: "30"
      TOP_STORIES: "3"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore credentials
        run: |
          test -n "$OPENROUTER_API_KEY"
          test -n "$YOUTUBE_TOKEN_JSON_B64"
          test -n "$YOUTUBE_CLIENT_SECRET_JSON_B64"
          printf '%s' "$YOUTUBE_TOKEN_JSON_B64" | base64 -d > token.json
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON_B64" | base64 -d > client_secret.json

      - name: Run agent
        run: python -m app.main

      - name: Retain generated Short
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-short-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: error

      - name: Save story history
        run: |
          git config user.name "ai-news-agent"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Update news history"
          git push
